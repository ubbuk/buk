# 1С → ERP (Postgres) sync. 1С өөрөө үе үе унтардаг тул нэг команд амжилтгүй болсон ч дараагийнх нь үргэлжилнэ.
# 1С-тэй холбогдож чадаагүй (fetch failed, timeout) алхмыг 2 минутын дараа нэг удаа автоматаар дахин оролдоно (scripts/ci/sync-run.sh); код, эрхийн алдаанд үгүй.
# Алдааг GitHub-ийн анхааруулга (warning) болгон харуулна; дэлгэрэнгүй нь ERP-ийн onec_sync_log хүснэгтэд.
#
# Хуваарь нь UTC: Улаанбаатар = UTC+8.
#   "*/15 1-11 * * 1-6" → 09:00–19:59 УБ, Даваа–Бямба: 15 минут тутам stock, receivables, current (sales, pl),
#                          receivables-odata («Авлага» табын агшин зураг, OData Balance), snapshots (мониторингийн мөнгөний үлдэгдэл, сарын зарцуулалт). Мөнгөн хөрөнгө таб (cash) энд татагдахгүй: OData-аас шууд.
#   (regular дотор) «Үйлдвэрлэл» табын агшин зураг: mode=production-month (одоогийн сар + хаагдаагүй өмнөх сар). Өмнөх саруудыг гараар mode=production-backfill (from, to).
#   "10 4,11 * * 1-6"   → 12:10 ба 19:10 УБ, Даваа–Бямба: «Цалин» табын сарын нийт дүн (mode=payroll; одоогийн + өмнөх сар). Regular-аас тусдаа, дангаараа.
#   "0 2 1-3 * *"       → сарын 1–3-ны 10:00 УБ: өмнөх сар + энэ сар (өмнөх сарыг эцэслэх)
#   "30 17 * * *"       → өдөр бүр 01:30 УБ: prune (хуучин onec_stock snapshot, onec_sync_log цэвэрлэх; lib/onec/retention.ts). Анхдагч нь DRY-RUN:
#                          юу ч устгахгүй, зөвхөн юу устахыг лог руу бичнэ. Үнэхээр устгахыг асаах (код өөрчлөхгүй):
#                            gh variable set PRUNE_APPLY --body 1   (унтраах: gh variable delete PRUNE_APPLY)
# Гараар (workflow_dispatch): mode=prune | import-materials. Хоёулаа apply=false (анхдагч) үед DRY-RUN; apply=true үед үнэхээр бичнэ/устгана.
#   import-materials: onec_stock-ийн сүүлийн snapshot → Material + InventoryBalance (Warehouse.onecCode-той складууд, байгааг дардаггүй; lib/onec/material-import.ts).
#   prune, import-materials нь 1С-д хандахгүй: зөвхөн DATABASE_URL хэрэгтэй.
# Олон жилийн бааз: ONEC_BASES secret (JSON) байвал татаалт бүр өөрийн оны баазаас; 1-2-р сард өмнөх оны 12-р сарыг (closing) мөн татна.
# Хүнд татаалт (сар, авлагын агшин зураг) Vercel-ийн route дээр биш ЭНД ажиллана: ERP-ийн «Шинэчлэх» товч workflow_dispatch-ыг
# GitHub API-аар дуудна (mode=month | receivables, month=YYYY-MM; lib/github-dispatch.ts). Ажил дуусахад onec_sync_log-д бүртгэгдэж,
# хуудас түүнийг харж шинэчлэгдэнэ.
# Анхаарах: GitHub-ийн хуваарь нь зөвхөн default branch дээр ажиллана, хэдэн минут хоцорч болно.
name: Sync 1C

on:
  schedule:
    - cron: "*/15 1-11 * * 1-6"
    - cron: "0 2 1-3 * *"
    - cron: "30 17 * * *"
    - cron: "10 4,11 * * 1-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "regular = stock + receivables + current + авлагын агшин зураг; recent = өмнөх + энэ сар; backfill = from..to саруудыг татах; month = нэг сар (sales+pl); receivables = нэг өдрийн авлагын агшин зураг; receivables-backfill = from..to өнгөрсөн сар бүрийн эцсийн авлагын агшин зураг (зөвхөн 1201, сар бүр 1 хүсэлт, дараалан); production-month = «Үйлдвэрлэл» табын одоогийн сар (+ хаагдаагүй өмнөх сар); production-backfill = from..to саруудын үйлдвэрлэл (сар бүр 1 татаалт, дараалан, татагдсан сарыг алгасна; force=true бол алгасахгүй, дахин татна); expenses-backfill = from..to өнгөрсөн сар бүрийн зардал (зөвхөн pl, сар бүр 1 татаалт, дараалан, татагдсан сарыг алгасна); prune = хуучин snapshot, лог цэвэрлэх; import-materials = onec_stock → Material + InventoryBalance"
        type: choice
        options: [regular, recent, backfill, month, receivables, receivables-backfill, expenses-backfill, production-month, production-backfill, payroll, prune, import-materials]
        default: regular
      apply:
        description: "prune, import-materials: true бол үнэхээр устгана/бичнэ. Анхдагч (false) нь DRY-RUN: зөвхөн тайлан"
        type: boolean
        default: false
      month:
        description: "month, receivables: YYYY-MM (receivables: одоогийн сар бол өнөөдөр, өнгөрсөн сар бол сарын эцэс)"
        type: string
        required: false
      from:
        description: "backfill, receivables-backfill, expenses-backfill, production-backfill: эхний сар (YYYY-MM)"
        type: string
        required: false
      to:
        description: "backfill, receivables-backfill, expenses-backfill, production-backfill: сүүлийн сар (YYYY-MM)"
        type: string
        required: false
      force:
        description: "production-backfill: true бол from..to сарыг «татагдсан» гэж алгасахгүй: тэр сарын үйлдвэрлэлийн мөрүүдийг (дараа нь брак болсон, бракаас/засвараас бэлэн болгосон шилжүүлэг орно) устгаад 1С-ээс дахин татна. Анхдагч (false) нь татагдсан сарыг алгасна"
        type: boolean
        default: false

# Давхар ажиллахгүй: өмнөх нь дуусахыг хүлээнэ (дундаа цуцлахгүй, учир нь transaction дундаас таслагдаж болохгүй)
concurrency:
  group: sync-1c
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependency-ийн install script нууц утгатай орчинд ажиллахгүй; Prisma client-ийг доор тусад нь үүсгэнэ
      - run: npm ci --ignore-scripts

      - run: npx prisma generate

      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Олон жилийн бааз (JSON): {"2026":"http://host/BUK_NBB_2026","2027":"..."}. Тохируулсан бол жил бүрийн татаалт өөрийнх нь баазаас (lib/onec/bases.ts)
          ONEC_BASES: ${{ secrets.ONEC_BASES }}
          ONEC_BASE_URL: ${{ secrets.ONEC_BASE_URL }}
          ONEC_USER: ${{ secrets.ONEC_USER }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
          ONEC_TIMEOUT_MS: "90000"
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_FORCE: ${{ inputs.force }}
          # Өдөр бүрийн prune-ийг үнэхээр устгадаг болгох (анхдагч нь DRY-RUN): gh variable set PRUNE_APPLY --body 1
          PRUNE_APPLY: ${{ vars.PRUNE_APPLY }}
          # «Авлага» агшин зураг (OData, зөвхөн унших). Тохируулаагүй бол тэр алхмыг алгасна.
          ONEC_ODATA_BASE_URL: ${{ secrets.ONEC_ODATA_BASE_URL }}
          ONEC_ODATA_USER: ${{ secrets.ONEC_ODATA_USER }}
          ONEC_ODATA_PASSWORD: ${{ secrets.ONEC_ODATA_PASSWORD }}
          # HTTP-сервисийн «receivables» алхам (onec_receivables, зөвхөн /api/v1/onec/receivables hub API-д). 1С-ийн /hs/dash/receivables 500 өгч байгаа тул
          # түр унтраасан. «Авлага» таб onec_receivable_balances-ийг (receivables-odata) уншдаг тул нөлөөлөхгүй. Дахин асаах (код өөрчлөхгүй):
          #   gh variable set SYNC_HTTP_RECEIVABLES --body 1   (унтраах: gh variable delete SYNC_HTTP_RECEIVABLES)
          SYNC_HTTP_RECEIVABLES: ${{ vars.SYNC_HTTP_RECEIVABLES }}
        shell: bash
        run: |
          set +e # нэг команд унасан ч үргэлжилнэ

          # ONEC_BASE_URL, ONEC_USER, ONEC_PASSWORD secret байхгүй бол ижил 1С-ийн ONEC_ODATA_* secret-ээс авна (lib/onec/client.ts hubConfig-тай ижил дүрэм):
          # хаяг = ONEC_ODATA_BASE_URL-ийн "/odata/standard.odata"-ийн өмнөх хэсэг. Ингэснээр secret цөөрнө.
          if [ -z "$ONEC_BASE_URL" ] && [ -n "$ONEC_ODATA_BASE_URL" ]; then export ONEC_BASE_URL="${ONEC_ODATA_BASE_URL%%/odata/standard.odata*}"; fi
          if [ -z "$ONEC_USER" ] && [ -n "$ONEC_ODATA_USER" ]; then export ONEC_USER="$ONEC_ODATA_USER"; fi
          if [ -z "$ONEC_PASSWORD" ] && [ -n "$ONEC_ODATA_PASSWORD" ]; then export ONEC_PASSWORD="$ONEC_ODATA_PASSWORD"; fi

          if [ "$EVENT_SCHEDULE" = "0 2 1-3 * *" ]; then mode=recent
          elif [ "$EVENT_SCHEDULE" = "30 17 * * *" ]; then mode=prune
          elif [ "$EVENT_SCHEDULE" = "10 4,11 * * 1-6" ]; then mode=payroll
          elif [ -n "$EVENT_SCHEDULE" ]; then mode=regular
          else mode="${INPUT_MODE:-regular}"; fi

          # ONEC_BASES байвал хаяг, нэвтрэлт нь түүн дотор (эсвэл ONEC_ODATA_*), тиймээс зөвхөн DATABASE_URL заавал.
          # prune, import-materials нь 1С-д хандахгүй: зөвхөн DATABASE_URL.
          required="DATABASE_URL"
          if [ -z "$ONEC_BASES" ] && [ "$mode" != "prune" ] && [ "$mode" != "import-materials" ]; then required="$required ONEC_BASE_URL ONEC_USER ONEC_PASSWORD"; fi
          for v in $required; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v (эсвэл ONEC_ODATA_*) тохируулаагүй байна"; exit 1; fi
          done

          failed=()
          # run <нэр> <секунд> <команд...>: 1С-тэй холбогдож чадаагүй алхмыг 2 минутын дараа НЭГ удаа дахин оролдоно (бусад алдаанд үгүй): scripts/ci/sync-run.sh
          source scripts/ci/sync-run.sh

          odata_ready() {
            if [ -n "$ONEC_BASES" ]; then return 0; fi
            if [ -n "$ONEC_ODATA_BASE_URL" ] && [ -n "$ONEC_ODATA_USER" ] && [ -n "$ONEC_ODATA_PASSWORD" ]; then return 0; fi
            echo "::warning title=receivables-odata::ONEC_ODATA_BASE_URL/USER/PASSWORD secret тохируулаагүй тул авлагын агшин зургийг алгасла"
            return 1
          }
          month_re='^[0-9]{4}-(0[1-9]|1[0-2])$'

          case "$mode" in
            regular)
              run stock 240 npm run sync:1c -- stock
              if [ "$SYNC_HTTP_RECEIVABLES" = "1" ]; then run receivables 240 npm run sync:1c -- receivables; else echo "::notice title=receivables::HTTP receivables алхмыг түр унтраасан (SYNC_HTTP_RECEIVABLES=1 болговол асна); «Авлага» таб receivables-odata-аар шинэчлэгдэнэ"; fi
              run current 720 npm run sync:1c -- current
              if odata_ready; then run receivables-odata 900 npm run sync:1c -- receivables-odata; fi
              # Мониторингийн «1С · Санхүүгийн тойм»: мөнгөний үлдэгдэл, энэ сарын зарцуулалт (OData, зөвхөн унших). Хоёр алхам бие даасан.
              if odata_ready; then run snapshots 300 npm run sync:1c -- snapshots; fi
              # «Үйлдвэрлэл» таб: одоогийн сар (өнөөдөр багтсан) + өмнөх сар хаагдаагүй бол (OData, зөвхөн унших; 1 сар ≈ 1 сек, ~200 бичилт)
              if odata_ready; then run production-month 300 npm run sync:1c -- production-month; fi
              # «Цалин»-г энд ажиллуулахгүй: тусдаа хуваарьтай (mode=payroll, өдөрт 2 удаа), 1С-д ачаалал өгөхгүйн тулд бусад алхмаас тусад нь
              # 1-2-р сард өмнөх оны баазад хаалтын засвар орно: өмнөх оны 12-р сарыг мөн татна (бусад үед алгасна)
              run closing 1500 npm run sync:1c -- closing
              # Баазад сүүлийн 7 хоногт шинэ баримт ороогүй (бааз солигдсон байж магадгүй) бол анхааруулга, ADMIN-д мэдэгдэл
              if odata_ready; then run health 120 npm run sync:1c -- health; fi
              ;;
            month)
              if ! [[ "$INPUT_MONTH" =~ $month_re ]]; then echo "::error::month нь YYYY-MM хэлбэртэй байх ёстой"; exit 1; fi
              run "month $INPUT_MONTH" 1200 npm run sync:1c -- range "$INPUT_MONTH" "$INPUT_MONTH"
              ;;
            payroll)
              # «Цалин» табын сарын нийт дүн (OData, зөвхөн унших; зөвхөн байгууллагын нийт, хүн/хэлтэс хадгалахгүй): одоогийн + өмнөх сар (+ байхгүй сар).
              # Өөр алхамгүй, дангаараа (concurrency: regular ажил дуусахыг хүлээнэ). Нийт 3 минутын дээд хязгаартай (lib/onec/payroll-store.ts), хэтэрвэл дараагийн удаа үргэлжилнэ.
              if odata_ready; then run payroll 240 npm run sync:1c -- payroll; fi
              ;;
            production-month)
              if odata_ready; then run production-month 300 npm run sync:1c -- production-month; fi
              ;;
            production-backfill)
              # Нэг удаагийн нөхөлт: өмнөх сар бүрийн үйлдвэрлэл. Сар бүр 1 татаалт, 15 сек завсарлагатай дараалан; татагдсан сарыг алгасна. Нэг удаад ≤ 24 сар.
              if ! [[ "$INPUT_FROM" =~ $month_re && "$INPUT_TO" =~ $month_re ]]; then
                echo "::error::production-backfill-д from, to нь YYYY-MM хэлбэртэй байх ёстой"; exit 1
              fi
              # force=true: татагдсан сарыг алгасахгүй, сарын мөрийг (reclass, defect_to_ready, repair_to_ready орно) устгаад дахин татна (анхдагч false)
              force_flag=""
              if [ "$INPUT_FORCE" = "true" ]; then force_flag="--force"; fi
              if odata_ready; then run "production-backfill $INPUT_FROM..$INPUT_TO${force_flag:+ force}" 1380 npm run sync:1c -- production-backfill "$INPUT_FROM" "$INPUT_TO" --pause=15 $force_flag; fi
              ;;
            receivables)
              if ! [[ "$INPUT_MONTH" =~ $month_re ]]; then echo "::error::month нь YYYY-MM хэлбэртэй байх ёстой"; exit 1; fi
              if odata_ready; then run "receivables-odata $INPUT_MONTH" 900 npm run sync:1c -- receivables-odata "$INPUT_MONTH"; fi
              ;;
            recent)
              run recent 1200 npm run sync:1c -- recent
              ;;
            prune|import-materials)
              # --apply-гүй бол DRY-RUN. --apply: гараар apply=true өгөхөд; prune-ийн өдөр бүрийн хуваарьт зөвхөн repository variable PRUNE_APPLY=1 үед
              apply_flag=""
              if [ "$INPUT_APPLY" = "true" ]; then apply_flag="--apply"; fi
              if [ "$mode" = "prune" ] && [ -n "$EVENT_SCHEDULE" ] && [ "$PRUNE_APPLY" = "1" ]; then apply_flag="--apply"; fi
              run "$mode ${apply_flag:-dry-run}" 900 npm run sync:1c -- "$mode" $apply_flag
              ;;
            expenses-backfill)
              # Нэг удаагийн нөхөлт: өнгөрсөн сар бүрийн зардал (Зардал таб, 12 сарын график). Зөвхөн pl, сар бүр 1 татаалт, 15 сек завсарлагатай дараалан;
              # татагдсан сарыг алгасна (дахин ажиллуулахад 1С-д хүрэхгүй). Нэг удаад ≤ 24 сар.
              if ! [[ "$INPUT_FROM" =~ $month_re && "$INPUT_TO" =~ $month_re ]]; then
                echo "::error::expenses-backfill-д from, to нь YYYY-MM хэлбэртэй байх ёстой"; exit 1
              fi
              if odata_ready; then run "expenses-backfill $INPUT_FROM..$INPUT_TO" 1380 npm run sync:1c -- expenses-backfill "$INPUT_FROM" "$INPUT_TO" --pause=15; fi
              ;;
            receivables-backfill)
              # Нэг удаагийн нөхөлт: өнгөрсөн сар бүрийн эцсийн авлага (12 сарын график). Зөвхөн 1201, сар бүр 1 хүсэлт, 15 сек завсарлагатай дараалан;
              # татагдсан сарыг алгасна (дахин ажиллуулахад 1С-д хүрэхгүй). Нэг удаад ≤ 24 сар.
              if ! [[ "$INPUT_FROM" =~ $month_re && "$INPUT_TO" =~ $month_re ]]; then
                echo "::error::receivables-backfill-д from, to нь YYYY-MM хэлбэртэй байх ёстой"; exit 1
              fi
              if odata_ready; then run "receivables-backfill $INPUT_FROM..$INPUT_TO" 1380 npm run sync:1c -- receivables-backfill "$INPUT_FROM" "$INPUT_TO" --pause=15; fi
              ;;
            backfill)
              re='^[0-9]{4}-(0[1-9]|1[0-2])$'
              if ! [[ "$INPUT_FROM" =~ $re && "$INPUT_TO" =~ $re ]]; then
                echo "::error::backfill-д from, to нь YYYY-MM хэлбэртэй байх ёстой"; exit 1
              fi
              run backfill 1380 npm run sync:1c -- range "$INPUT_FROM" "$INPUT_TO"
              ;;
          esac

          {
            echo "### 1С sync ($mode)"
            if [ ${#failed[@]} -eq 0 ]; then echo "Бүх алхам амжилттай."; else echo "Амжилтгүй: ${failed[*]}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Бүх алхам ажиллаж дууссаны ДАРАА: аль нэг нь унасан бол run failure болж GitHub бүтэлгүйтлийн имэйл илгээнэ
          if [ ${#failed[@]} -ne 0 ]; then echo "::error::Амжилтгүй алхам: ${failed[*]}"; exit 1; fi
          exit 0
