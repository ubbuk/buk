# 1С → ERP (Postgres) sync. 1С өөрөө үе үе унтардаг тул нэг команд амжилтгүй болсон ч дараагийнх нь үргэлжилнэ.
# Алдааг GitHub-ийн анхааруулга (warning) болгон харуулна; дэлгэрэнгүй нь ERP-ийн onec_sync_log хүснэгтэд.
#
# Хуваарь нь UTC: Улаанбаатар = UTC+8.
#   "*/15 1-11 * * 1-6" → 09:00–19:59 УБ, Даваа–Бямба: 15 минут тутам stock, receivables, current (sales, pl, cash),
#                          receivables-odata («Авлага» табын агшин зураг, OData Balance)
#   "0 2 1-3 * *"       → сарын 1–3-ны 10:00 УБ: өмнөх сар + энэ сар (өмнөх сарыг эцэслэх)
# Хүнд татаалт (сар, авлагын агшин зураг) Vercel-ийн route дээр биш ЭНД ажиллана: ERP-ийн «Шинэчлэх» товч workflow_dispatch-ыг
# GitHub API-аар дуудна (mode=month | receivables, month=YYYY-MM; lib/github-dispatch.ts). Ажил дуусахад onec_sync_log-д бүртгэгдэж,
# хуудас түүнийг харж шинэчлэгдэнэ.
# Анхаарах: GitHub-ийн хуваарь нь зөвхөн default branch дээр ажиллана, хэдэн минут хоцорч болно.
name: Sync 1C

on:
  schedule:
    - cron: "*/15 1-11 * * 1-6"
    - cron: "0 2 1-3 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "regular = stock + receivables + current + авлагын агшин зураг; recent = өмнөх + энэ сар; backfill = from..to саруудыг татах; month = нэг сар (sales+pl+cash); receivables = нэг өдрийн авлагын агшин зураг"
        type: choice
        options: [regular, recent, backfill, month, receivables]
        default: regular
      month:
        description: "month, receivables: YYYY-MM (receivables: одоогийн сар бол өнөөдөр, өнгөрсөн сар бол сарын эцэс)"
        type: string
        required: false
      from:
        description: "backfill: эхний сар (YYYY-MM)"
        type: string
        required: false
      to:
        description: "backfill: сүүлийн сар (YYYY-MM)"
        type: string
        required: false

# Давхар ажиллахгүй: өмнөх нь дуусахыг хүлээнэ (дундаа цуцлахгүй, учир нь transaction дундаас таслагдаж болохгүй)
concurrency:
  group: sync-1c
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependency-ийн install script нууц утгатай орчинд ажиллахгүй; Prisma client-ийг доор тусад нь үүсгэнэ
      - run: npm ci --ignore-scripts

      - run: npx prisma generate

      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ONEC_BASE_URL: ${{ secrets.ONEC_BASE_URL }}
          ONEC_USER: ${{ secrets.ONEC_USER }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
          ONEC_TIMEOUT_MS: "90000"
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_MONTH: ${{ inputs.month }}
          # «Авлага» агшин зураг (OData, зөвхөн унших). Тохируулаагүй бол тэр алхмыг алгасна.
          ONEC_ODATA_BASE_URL: ${{ secrets.ONEC_ODATA_BASE_URL }}
          ONEC_ODATA_USER: ${{ secrets.ONEC_ODATA_USER }}
          ONEC_ODATA_PASSWORD: ${{ secrets.ONEC_ODATA_PASSWORD }}
        shell: bash
        run: |
          set +e # нэг команд унасан ч үргэлжилнэ

          # ONEC_BASE_URL, ONEC_USER, ONEC_PASSWORD secret байхгүй бол ижил 1С-ийн ONEC_ODATA_* secret-ээс авна (lib/onec/client.ts hubConfig-тай ижил дүрэм):
          # хаяг = ONEC_ODATA_BASE_URL-ийн "/odata/standard.odata"-ийн өмнөх хэсэг. Ингэснээр secret цөөрнө.
          if [ -z "$ONEC_BASE_URL" ] && [ -n "$ONEC_ODATA_BASE_URL" ]; then export ONEC_BASE_URL="${ONEC_ODATA_BASE_URL%%/odata/standard.odata*}"; fi
          if [ -z "$ONEC_USER" ] && [ -n "$ONEC_ODATA_USER" ]; then export ONEC_USER="$ONEC_ODATA_USER"; fi
          if [ -z "$ONEC_PASSWORD" ] && [ -n "$ONEC_ODATA_PASSWORD" ]; then export ONEC_PASSWORD="$ONEC_ODATA_PASSWORD"; fi

          for v in DATABASE_URL ONEC_BASE_URL ONEC_USER ONEC_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v (эсвэл ONEC_ODATA_*) тохируулаагүй байна"; exit 1; fi
          done

          if [ "$EVENT_SCHEDULE" = "0 2 1-3 * *" ]; then mode=recent
          elif [ -n "$EVENT_SCHEDULE" ]; then mode=regular
          else mode="${INPUT_MODE:-regular}"; fi

          failed=()
          run() { # run <нэр> <секунд> <команд...>
            local name=$1 secs=$2; shift 2
            echo "::group::$name"
            timeout "$secs" "$@"
            local code=$?
            echo "::endgroup::"
            if [ $code -ne 0 ]; then
              echo "::warning title=1С sync: $name::код $code (1С унтарсан байж магадгүй; onec_sync_log-ийг үзнэ үү)"
              failed+=("$name")
            fi
          }

          odata_ready() {
            if [ -n "$ONEC_ODATA_BASE_URL" ] && [ -n "$ONEC_ODATA_USER" ] && [ -n "$ONEC_ODATA_PASSWORD" ]; then return 0; fi
            echo "::warning title=receivables-odata::ONEC_ODATA_BASE_URL/USER/PASSWORD secret тохируулаагүй тул авлагын агшин зургийг алгасла"
            return 1
          }
          month_re='^[0-9]{4}-(0[1-9]|1[0-2])$'

          case "$mode" in
            regular)
              run stock 240 npm run sync:1c -- stock
              run receivables 240 npm run sync:1c -- receivables
              run current 720 npm run sync:1c -- current
              if odata_ready; then run receivables-odata 900 npm run sync:1c -- receivables-odata; fi
              ;;
            month)
              if ! [[ "$INPUT_MONTH" =~ $month_re ]]; then echo "::error::month нь YYYY-MM хэлбэртэй байх ёстой"; exit 1; fi
              run "month $INPUT_MONTH" 1200 npm run sync:1c -- range "$INPUT_MONTH" "$INPUT_MONTH"
              ;;
            receivables)
              if ! [[ "$INPUT_MONTH" =~ $month_re ]]; then echo "::error::month нь YYYY-MM хэлбэртэй байх ёстой"; exit 1; fi
              if odata_ready; then run "receivables-odata $INPUT_MONTH" 900 npm run sync:1c -- receivables-odata "$INPUT_MONTH"; fi
              ;;
            recent)
              run recent 1200 npm run sync:1c -- recent
              ;;
            backfill)
              re='^[0-9]{4}-(0[1-9]|1[0-2])$'
              if ! [[ "$INPUT_FROM" =~ $re && "$INPUT_TO" =~ $re ]]; then
                echo "::error::backfill-д from, to нь YYYY-MM хэлбэртэй байх ёстой"; exit 1
              fi
              run backfill 1380 npm run sync:1c -- range "$INPUT_FROM" "$INPUT_TO"
              ;;
          esac

          {
            echo "### 1С sync ($mode)"
            if [ ${#failed[@]} -eq 0 ]; then echo "Бүх алхам амжилттай."; else echo "Амжилтгүй: ${failed[*]}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
